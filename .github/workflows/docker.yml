name: Upload to Docker

# Controls when the action will run. 
on:
  release: 
    types: [created]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # 新增：release 触发时添加 latest 标签
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # 可选：手动触发时也添加 latest 标签
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}            
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: buildx
        with:
          install: true  # 确保安装最新版 Buildx
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64  # 关键：指定amd64和arm64架构
          builder: ${{ steps.buildx.outputs.name }}  # 使用Buildx构建器

      # Send Feishu notification
      - name: "Send Feishu notification"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            STATUS_TEXT="成功"
          elif [ "$STATUS" == "failure" ]; then
            STATUS_TEXT="失败"
          else
            STATUS_TEXT="取消"
          fi
          
          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"GitHub workflow 通知：\\n- 工作流：Upload to Docker\\n- 状态：$STATUS_TEXT\\n- 触发事件：${{ github.event_name }}\\n- 提交：${{ github.sha }}\\n- 分支：${{ github.ref }}\\n- 仓库：${{ github.repository }}\"
              }
            }"
            
  request-gitea-1panel-upgrade:
    needs: [docker]
    if: ${{ needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            # 手动触发：拉取本仓库最新的 release tag 作为版本
            RAW="$(curl -fsSL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name // empty')"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::无法解析版本号（手动触发时仓库需至少有一个 release）"
            exit 1
          fi

          CLEAN="${RAW#v}"     # 去掉 v 前缀
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $CLEAN"

      - name: Wait for Docker image availability
        run: sleep 10

      - name: Request controlled Gitea upgrade
        shell: bash
        env:
          GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
          GITEA_OWNER: devops
          GITEA_REPO: doco-cd
          GITEA_LABEL_ID: ${{ vars.GITEA_CONTROLLED_UPDATE_LABEL_ID }}
          GITEA_ISSUE_TOKEN: ${{ secrets.GITEA_ISSUE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$GITEA_LABEL_ID" =~ ^[0-9]+$ ]]

          request_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          request_body="$(
            jq -nc \
              --arg request_id "$request_id" \
              --arg version "$VERSION" \
              --arg requested_at "$requested_at" \
              '{
                request_id: $request_id,
                service: "epub-browser",
                changes: {EPUB_BROWSER_VERSION: $version},
                requested_by: "github-actions",
                requested_at: $requested_at
              }'
          )"

          issue_payload="$(
            jq -nc \
              --arg title "controlled-update: epub-browser-$VERSION" \
              --arg body "$request_body" \
              --argjson label_id "$GITEA_LABEL_ID" \
              '{title: $title, body: $body, labels: [$label_id]}'
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$GITEA_BASE_URL/api/v1/repos/$GITEA_OWNER/$GITEA_REPO/issues" \
            --header "Authorization: token $GITEA_ISSUE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$issue_payload"

  request-gitea-mbp-upgrade:
    needs: [docker]
    if: ${{ needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            # 手动触发：拉取本仓库最新的 release tag 作为版本
            RAW="$(curl -fsSL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name // empty')"
          fi

          if [ -z "$RAW" ]; then
            echo "::error::无法解析版本号（手动触发时仓库需至少有一个 release）"
            exit 1
          fi

          CLEAN="${RAW#v}"     # 去掉 v 前缀
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $CLEAN"

      - name: Wait for Docker image availability
        run: sleep 10

      - name: Request controlled Gitea upgrade
        shell: bash
        env:
          GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
          GITEA_OWNER: devops
          GITEA_REPO: doco-cd-macos
          GITEA_LABEL_ID: ${{ vars.GITEA_CONTROLLED_UPDATE_MBP_LABEL_ID }}
          GITEA_ISSUE_TOKEN: ${{ secrets.GITEA_ISSUE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$GITEA_LABEL_ID" =~ ^[0-9]+$ ]]

          request_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          request_body="$(
            jq -nc \
              --arg request_id "$request_id" \
              --arg version "$VERSION" \
              --arg requested_at "$requested_at" \
              '{
                request_id: $request_id,
                service: "epub-browser",
                changes: {EPUB_BROWSER_VERSION: $version},
                requested_by: "github-actions",
                requested_at: $requested_at
              }'
          )"

          issue_payload="$(
            jq -nc \
              --arg title "controlled-update: epub-browser-$VERSION" \
              --arg body "$request_body" \
              --argjson label_id "$GITEA_LABEL_ID" \
              '{title: $title, body: $body, labels: [$label_id]}'
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$GITEA_BASE_URL/api/v1/repos/$GITEA_OWNER/$GITEA_REPO/issues" \
            --header "Authorization: token $GITEA_ISSUE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$issue_payload"