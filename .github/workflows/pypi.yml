# This is a basic workflow to help you get started with Actions

name: Upload to PIP

# Controls when the action will run. 
on:
  release: 
    types: [created]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "upload"
  upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Sets up python
      - uses: actions/setup-python@v2
        with:
          python-version: 3.14

      # Install dependencies
      - name: "Installs dependencies"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build setuptools wheel twine

      - name: "Provisions network-isolated release builder"
        run: |
          docker build --tag epub-browser-release-builder:local - <<'DOCKERFILE'
          FROM python:3.14-slim
          RUN python -m pip install --no-cache-dir build setuptools wheel
          DOCKERFILE

      # Build and upload to PyPI
      - name: "Builds and uploads to PyPI"
        run: |
          python tools/sync_vendor_assets.py fetch
          python tools/sync_vendor_assets.py verify
          EPUB_BROWSER_RELEASE_BUILDER_IMAGE=epub-browser-release-builder:local \
            python3 -m unittest \
              tests.test_vendor_assets.VendorAssetTests.test_docker_network_isolation_blocks_backend_network_attempts \
              -v
          python -m build --wheel --outdir dist/direct
          python -m build --sdist --outdir dist/release
          python tools/verify_release_artifacts.py \
            --wheel dist/direct/*.whl \
            --sdist dist/release/*.tar.gz \
            --rebuilt-wheel-dir dist/rebuilt \
            --network-isolation docker \
            --builder-image epub-browser-release-builder:local
          python3 -m twine upload dist/direct/*.whl dist/release/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_TOKEN }}

      # Send Feishu notification
      - name: "Send Feishu notification"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            STATUS_TEXT="成功"
          elif [ "$STATUS" == "failure" ]; then
            STATUS_TEXT="失败"
          else
            STATUS_TEXT="取消"
          fi
          
          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"GitHub workflow 通知：\\n- 工作流：Upload to PIP\\n- 状态：$STATUS_TEXT\\n- 触发事件：${{ github.event_name }}\\n- 提交：${{ github.sha }}\\n- 分支：${{ github.ref }}\\n- 仓库：${{ github.repository }}\"
              }
            }"
