name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/sync_vendor_assets.py fetch
      - run: python tools/sync_vendor_assets.py verify
      - run: python -m pip install -e .
      - name: Check static publishing and authenticated reader paths
        run: >-
          python -W ignore::ResourceWarning -m unittest
          tests.test_mode_integration tests.test_ssg tests.test_pdf_server
          tests.test_i18n_coverage tests.test_server_concurrency
      - run: node --test tests/*.js
